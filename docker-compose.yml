services:
  claude-api:
    build: .
    container_name: claude-api
    network_mode: "host"
    environment:
      CLAUDE_TOKEN: ${CLAUDE_TOKEN:?CLAUDE_TOKEN is required — run 'claude setup-token'}
      HAIKU_API_KEY: ${HAIKU_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
