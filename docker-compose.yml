services:
  claude-api:
    build: .
    container_name: claude-api
    ports:
      - "127.0.0.1:8000:8000"
      # OAuth callback port. Codex's sign-in only redirects to localhost:1455.
      - "127.0.0.1:1455:1455"
    environment:
      # Optional: a `claude setup-token` token, used until you sign in on the page.
      CLAUDE_TOKEN: ${CLAUDE_TOKEN:-}
    volumes:
      - tokens:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  tokens:
